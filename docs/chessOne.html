<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>象棋</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#333333">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    ::-webkit-scrollbar { display: none; }
    html, body { -ms-overflow-style: none; scrollbar-width: none; }

    :root {
      --cell-size: min(8.5vw, 6.8vh, 120px); 
      --piece-size: calc(var(--cell-size) * 0.88); 
      --font-size: calc(var(--piece-size) * 0.58);
      --board-color: #e4c695;
    }

    body { font-family: sans-serif; text-align: center; background: #f0f0f0; margin: 0; padding: 10px; touch-action: pan-y; overflow-x: hidden; }
    h2 { margin: 5px 0; font-size: calc(var(--piece-size) * 0.58); }
    
    .status-container { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
    
    #info { font-size: calc(var(--cell-size) * 0.3);  color: #a0a0a0; white-space: pre-wrap; line-height: 1.6; font-family: sans-serif; }
    #info::first-line { font-size: calc(var(--cell-size) * 0.4); color: #2584f0; font-weight: bold; }
    
    .btn-undo, .btn-reselect, .btn-restart, .btn-reject { padding: 5px 15px; border-radius: 15px; font-size: calc(var(--cell-size) * 0.23);  color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-undo { background-color: #ff9800; } .btn-reselect { background-color: #2196F3; }
    .btn-restart { background-color: #4CAF50; } .btn-reject { background-color: #d32f2f; }
    
    .check-alert { color: red; font-size: calc(var(--cell-size) * 0.4);  font-weight: bold; animation: blink 1s infinite; display: none; margin: 5px; }
    .req-alert { color: #E91E63; font-size: calc(var(--cell-size) * 0.4);  font-weight: bold; animation: blink 1.5s infinite; display: none; margin: 5px; }
    .think-alert { color: #e91eba; font-size: calc(var(--cell-size) * 0.4);  font-weight: bold; animation: blink 0.9s infinite; display: none; margin: 5px; }
    @keyframes blink { 50% { opacity: 0; } }
    
    
    #board-container {
      display: inline-block; background: var(--board-color); border: 3px solid #333;
      padding: calc(var(--cell-size) / 2); box-shadow: 2px 5px 10px rgba(0,0,0,0.3);
      -webkit-user-select: none; user-select: none; border-radius: 4px; margin-top: 15px; margin-bottom: 15px;
      font-size: calc(var(--piece-size) * 0.58);
    }
    #board-relative-wrapper { position: relative; }
    #board-svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
    #board-grid { display: grid; position: relative; z-index: 2; grid-template-columns: repeat(9, var(--cell-size)); grid-template-rows: repeat(10, var(--cell-size)); }
    .cell { position: relative; display: flex; justify-content: center; align-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }

    .piece {
      width: var(--piece-size); height: var(--piece-size); border-radius: 50%; position: absolute; z-index: 10;
      display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: var(--font-size); 
      box-shadow: 2px 2px 5px rgba(0,0,0,0.4); background: #fdf6e3; border: 2px solid #333; 
    }
    .piece.red { color: #d32f2f; border-color: #d32f2f; }
    .piece.black { color: #212121; border-color: #212121; }
    .piece.selected { box-shadow: 0 0 10px 4px #00BCD4; transform: scale(1.15); z-index: 15; } 
    .cell.valid-move::after { content: ''; position: absolute; width: calc(var(--cell-size) * 0.3); height: calc(var(--cell-size) * 0.3); background: rgba(0, 188, 212, 0.7); border-radius: 50%; z-index: 12; }

    .cell.last-move-origin::before { content: ''; position: absolute; width: calc(var(--cell-size) * 0.5); height: calc(var(--cell-size) * 0.5); background-color: rgba(255, 152, 0, 0.4); border-radius: 50%; z-index: 5; }
    .piece.last-moved { box-shadow: 0 0 0 3px #FF9800, 0 0 15px 4px rgba(255, 152, 0, 0.7); z-index: 14; }

    #role-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 999; justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 25px; border-radius: 10px; text-align: center; max-width: 340px; position: relative; font-size: calc(var(--cell-size) * 0.3); }
    .modal-btn { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: calc(var(--cell-size) * 0.33); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; }
    .modal-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    #btn-role-b { background: #212121; } #btn-role-r { background: #d32f2f; } #btn-role-s { background: #757575; }
    .btn-ai-easy { background: #8D6E63; margin: 0 !important; flex: 1; } .btn-ai-hard { background: #5E35B1; margin: 0 !important; flex: 1; }
    .ai-btn-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .modal-subtitle { margin: 15px 0 8px 0; color: #444; font-size: calc(var(--cell-size) * 0.33);  font-weight: bold; text-align: left;}
    .role-badge { display: inline-block; padding: 5px 15px; border-radius: 15px; color: white; background: #555; font-size: calc(var(--cell-size) * 0.23);  }
    .role-b { background: #212121; } .role-r { background: #d32f2f; }
  </style>
</head>
<body>

  <div id="role-modal">
    <div class="modal-content">
      <span id="close-modal-btn" style="position:absolute; top:10px; right:15px; font-size:calc(var(--cell-size) * 0.33);  cursor:pointer; display:block; color:#999;" onclick="closeRoleModal()">&times;</span>

      <span>連線對戰 </span><span id="modal-room-name"></span>
      
      <button id="btn-role-b" class="modal-btn" onclick="requestRole('b')">執黑棋</button>
      <button id="btn-role-r" class="modal-btn" onclick="requestRole('r')">執紅棋</button>
      <button id="btn-role-s" class="modal-btn" onclick="requestRole('spectator')">當觀棋者</button>

      <div id="ai-menu-section">
        <hr style="border: 0; height: 1px; background: #ddd; margin: 20px 0 10px 0;">
        <div class="modal-subtitle">和AI對戰 </div>
        <div class="ai-btn-group">
          <span class="modal-subtitle">簡單：</span>
          <button class="modal-btn btn-ai-easy" onclick="startAiGame('b', 'easy')">執黑</button>
          <button class="modal-btn btn-ai-easy" onclick="startAiGame('r', 'easy')">執紅</button>
        </div>
        <div class="ai-btn-group">
          <span class="modal-subtitle">高級：</span>
          <button class="modal-btn btn-ai-hard" onclick="startAiGame('b', 'hard')">執黑</button>
          <button class="modal-btn btn-ai-hard" onclick="startAiGame('r', 'hard')">執紅</button>
        </div>
      </div>
    </div>
  </div>

  <h2 id="room-title"></h2>
  <div class="status-container">
  
    <button class="btn-reselect" onclick="showRoleModal()">🔄 切換角色</button>
    
    <button id="btn-replay" class="btn-reselect" style="display:none; background-color: #9C27B0;" onclick="startReplay()">▶️ 覆盤</button>
    <button id="btn-replay-stop" class="btn-reject" style="display:none; background-color: #757575;" onclick="stopReplay()">⏹️ 結束</button>
    
    <button id="restart-btn" class="btn-restart" style="display:none;"></button>
    <button id="reject-btn" class="btn-reject" style="display:none;" onclick="requestRestart('reject')">⛔ 拒絕</button>
    <button id="undo-btn" class="btn-undo" style="display:none;">OK</button>
    <button id="reject-undo-btn" class="btn-reject" style="display:none;" onclick="requestUndo('reject')">⛔ 拒絕</button>
    <span id="role-info" class="role-badge">連線中...</span>
  </div>
  
  <div id="board-container">
    <div id="board-relative-wrapper">
      <div id="board-svg-layer"></div>
      <div id="board-grid"></div>
    </div>
  </div>
  
  <div id="req-alert" class="req-alert"></div>
  <div id="think-alert" class="think-alert"></div>
  <div id="check-msg" class="check-alert">將軍！</div>
  <div id="info">等待同步...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="update.js"></script>
  <script src="chessOne.js"></script>
</body>
</html>
