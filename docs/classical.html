<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>棋譜</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    body { font-family: sans-serif; background-color: #f4f4f9; color: #333; text-align: center; padding: 20px; margin: 0; }
    h1 { color: #d32f2f; margin-bottom: 10px; font-size: 24px; }
    p.subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
    
    .control-panel { background: white; max-width: 400px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: left; }
    label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 15px; }
    input[type="text"], input[type="password"], select { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
    
    button { width: 100%; padding: 12px; background-color: #4CAF50; color: white; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.3s; margin-bottom: 10px; }
    button:hover { background-color: #45a049; }
    button:disabled { background-color: #9e9e9e; cursor: not-allowed; }
    
    .btn-blue { background-color: #2196F3; }
    .btn-blue:hover { background-color: #1976D2; }
    .btn-orange { background-color: #ff9800; }
    .btn-orange:hover { background-color: #e68a00; }

    #status-msg { margin-top: 15px; font-size: 14px; font-weight: bold; text-align: center; min-height: 20px; }
    .success { color: #2e7d32; } .error { color: #d32f2f; } .loading { color: #1976d2; }
    
    .divider { border: 0; height: 1px; background: #ddd; margin: 25px 0; }

    #noShowDefault {display:none;}

  </style>
</head>
<body>

  <h1>📖 棋譜500局</h1>

  <div class="control-panel">
    <label for="room-input">🏠 目標房間名</label>
    <input type="text" id="room-input" placeholder="棋局名" oninput="roomUpdate()">
    
    <div id="noShowDefault">
      <button onclick="jumpToRoom()" class="btn-orange">🚪 進入棋盤房間</button>

      <label for="admin-password">🔑 密碼</label>
      <input type="password" id="admin-password" placeholder="輸入密碼(板橋電話8碼)">

      <label for="scenario-select">♟️ 選擇棋局 <span id="count-display">載入中...</span></label>
      <select id="scenario-select"></select>
      <button id="set-btn" onclick="applyScenario()">🚀 佈局</button>

      <hr class="divider">

      <label for="custom-fen">🧩 貼上FEN</label>
      <input type="text" id="custom-fen" placeholder="貼上盤面FEN.">
      <button id="set-custom-btn" class="btn-blue" onclick="applyCustomFen()">🚀 自訂佈局</button>

      <div id="status-msg"></div>
      <div style="text-align:center;">
        <a href="https://app.jwint.net/chessAdmin/cleanExistPlayer" target="_blank" style="display:inline-block; margin-top:15px; text-decoration:none; color:#1976d2;">🚀 強制棋手退出</a> | 
        <a href="https://n.jwint.net/r?sqyq501" target="_blank" style="display:inline-block; margin-top:15px; text-decoration:none; color:#1976d2;">🚀 棋局解說</a> | 
        <a href="/" style="display:inline-block; margin-top:15px; text-decoration:none; color:#1976d2;">🚀 回到大廳</a>
      </div>
    </div>
  </div>

  <script src="classical.js"></script>
  <script>
    function roomUpdate() {
      const roomName = document.getElementById('room-input').value.trim();
      const actionArea = document.getElementById('noShowDefault');
      if (roomName.length > 0) {
        actionArea.style.display = 'block';
      }else{
        actionArea.style.display = 'none';
      }
    }
    
  </script>
</body>
</html>
